<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send to Manga Downloader</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f8fafc;
    --bg-subtle: #f1f5f9;
    --panel: #ffffff;
    --panel-hover: #f8fafc;
    --panel-elevated: #ffffff;
    --line: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: rgba(79, 70, 229, 0.08);
    --accent-text: #ffffff;
    --ok: #16a34a;
    --ok-bg: #f0fdf4;
    --ok-border: #bbf7d0;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --bad-border: #fecaca;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    --card-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0b0f17;
      --bg-subtle: #0f172a;
      --panel: #131b2e;
      --panel-hover: #1e293b;
      --panel-elevated: #182238;
      --line: #1e293b;
      --border-strong: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --accent-text: #ffffff;
      --ok: #4ade80;
      --ok-bg: rgba(74, 222, 128, 0.12);
      --ok-border: rgba(74, 222, 128, 0.3);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.12);
      --warn-border: rgba(251, 191, 36, 0.3);
      --bad: #f87171;
      --bad-bg: rgba(248, 113, 113, 0.12);
      --bad-border: rgba(248, 113, 113, 0.3);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
      --card-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-soft), transparent 70%);
    background-repeat: no-repeat;
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -0.01em;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 22px;
    box-shadow: var(--shadow-md), var(--card-highlight);
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  p.desc {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }
  form {
    display: grid;
    gap: 12px;
  }
  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.5;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  button {
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-sm);
  }
  button:hover {
    background: var(--panel-hover);
    border-color: var(--border-strong);
  }
  button.primary {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-hover) 100%);
    color: var(--accent-text);
    border-color: transparent;
    box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }
  button.primary:hover {
    filter: brightness(1.06);
    box-shadow: 0 4px 8px rgba(79, 70, 229, 0.4);
  }
  button.secondary {
    background: var(--bg-subtle);
    font-weight: 500;
    font-size: 14px;
    padding: 10px 14px;
  }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    filter: none;
  }
  #status {
    margin: 14px 0 0;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.45;
    display: none;
    border: 1px solid transparent;
  }
  #status:not(:empty) {
    display: block;
  }
  #status[data-result="success"] {
    background: var(--ok-bg);
    color: var(--ok);
    border-color: var(--ok-border);
  }
  #status[data-result="error"] {
    background: var(--bad-bg);
    color: var(--bad);
    border-color: var(--bad-border);
  }
  #status:not([data-result="success"]):not([data-result="error"]):not(:empty) {
    background: var(--bg-subtle);
    color: var(--muted);
    border-color: var(--line);
  }
  .footer-hint {
    margin-top: 18px;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand-row">
    <svg class="brand-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="phone-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--accent)" />
          <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>
      </defs>
      <rect width="28" height="28" rx="7" fill="url(#phone-brand-grad)" />
      <path d="M7 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12.5a.5.5 0 0 1-.78.41L14 17.8l-4.22 3.11A.5.5 0 0 1 9 20.5V8z" fill="#fff" fill-opacity="0.9" />
      <path d="M12 6h7a2 2 0 0 1 2 2v11.5a.5.5 0 0 1-.8.4L18 18.2V8a2 2 0 0 0-2-2z" fill="#fff" fill-opacity="0.45" />
      <path d="M14 9.5v5m-2.5-2.5h5" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" />
    </svg>
    <h1>Send to Manga Downloader</h1>
  </div>
  <p class="desc">Paste gallery or series links below. Downloads are saved on your PC.</p>
  <form id="send">
    <textarea id="urls" aria-label="Links to download" placeholder="https://… (one link per line)" required></textarea>
    <div class="actions">
      <button type="button" id="pasteBtn" class="secondary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Paste from clipboard
      </button>
      <button type="submit" id="submit" class="primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        Send to PC
      </button>
    </div>
  </form>
  <p id="status" role="status"></p>
</div>
<div class="footer-hint">Connected to local PC via trusted private Wi-Fi</div>

<script>
const token = new URLSearchParams(location.hash.slice(1)).get('token');
const status = document.getElementById('status'), button = document.getElementById('submit'), pasteBtn = document.getElementById('pasteBtn');
function showStatus(message, result) { status.textContent = message; status.dataset.result = result; }

if (!token) { showStatus('Open the full private link shown in the PC app.', 'error'); button.disabled = true; if (pasteBtn) pasteBtn.disabled = true; }

if (pasteBtn) {
  pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (!text || !text.trim()) { showStatus('Clipboard is empty.', 'error'); return; }
      const urlsEl = document.getElementById('urls');
      urlsEl.value = (urlsEl.value.trim() ? urlsEl.value.trim() + '\n' : '') + text.trim();
      showStatus('Pasted from clipboard.', 'success');
      urlsEl.focus();
    } catch {
      showStatus('Clipboard permission was not granted. Paste directly into the box.', 'error');
    }
  });
}

document.getElementById('send').onsubmit = async e => {
  e.preventDefault(); button.disabled = true;
  showStatus('Sending links…', '');
  try {
    const response = await fetch('/api/queue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': token },
      body: JSON.stringify({ urls: document.getElementById('urls').value })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || (response.status === 401 ? 'This link expired. Open the new link from your PC.' : 'Could not send links. Try again.'));
    const errors = data.rejected || [];
    const summary = data.added + ' queued, ' + data.alreadyQueued + ' already queued.';
    showStatus(summary + (errors.length ? ' Could not add: ' + errors.map(x => x.url + ': ' + x.error).join(' ') : ' Successfully sent to your PC.'), errors.length ? 'error' : 'success');
    document.getElementById('urls').value = errors.map(x => x.url).join('\n');
  } catch (error) {
    showStatus(error.message || 'Cannot reach your PC. Check Wi-Fi and keep the app running.', 'error');
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
